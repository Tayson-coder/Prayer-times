<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>مواقيت الصلاة</title>
  <meta name="description" content="مواقيت الصلاة مع الأذان بأصوات أشهر المؤذنين">
  <meta name="theme-color" content="#0f3d3e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div>
      <h1>مواقيت الصلاة</h1>
      <p class="sub"><span id="location-name">—</span></p>
    </div>
    <button id="open-settings" class="icon-btn" aria-label="الإعدادات" title="الإعدادات">⚙</button>
  </header>

  <main>
    <section class="hero card">
      <div class="dates">
        <span id="hijri-date"></span>
        <span id="greg-date" class="muted"></span>
      </div>
      <div class="next">
        <span class="muted">الصلاة القادمة</span>
        <strong id="next-name">—</strong>
        <span id="next-time" class="muted"></span>
        <div id="countdown" class="countdown" aria-live="polite">--:--:--</div>
      </div>
      <button id="unlock-audio" class="primary">🔔 تفعيل الأذان التلقائي</button>
      <p id="audio-status" class="muted small"></p>
    </section>

    <section class="card">
      <ul id="times" class="times"></ul>
    </section>

    <section class="card">
      <h2>المؤذن</h2>
      <div class="muezzin-row">
        <select id="muezzin-select" aria-label="اختيار المؤذن"></select>
        <button id="preview" class="secondary">▶ استماع</button>
        <button id="stop" class="secondary" hidden>■ إيقاف</button>
      </div>
      <p id="muezzin-source" class="muted small"></p>
    </section>
  </main>

  <!-- الإعدادات -->
  <dialog id="settings">
    <form method="dialog" class="settings-form">
      <header class="dialog-head">
        <h2>الإعدادات</h2>
        <button class="icon-btn" value="close" aria-label="إغلاق">✕</button>
      </header>

      <fieldset>
        <legend>الموقع</legend>
        <button type="button" id="use-gps" class="secondary">📍 تحديد موقعي تلقائياً</button>
        <label>أو اختر مدينة
          <select id="city-select"><option value="">— اختر —</option></select>
        </label>
        <div class="grid2">
          <label>خط العرض <input id="lat" type="number" step="any" inputmode="decimal"></label>
          <label>خط الطول <input id="lng" type="number" step="any" inputmode="decimal"></label>
        </div>
        <button type="button" id="save-coords" class="secondary">حفظ الإحداثيات</button>
      </fieldset>

      <fieldset>
        <legend>طريقة الحساب</legend>
        <label>الجهة <select id="method-select"></select></label>
        <label>حساب العصر
          <select id="asr-select">
            <option value="standard">الجمهور (شافعي، مالكي، حنبلي)</option>
            <option value="hanafi">الحنفي</option>
          </select>
        </label>
      </fieldset>

      <fieldset>
        <legend>الأذان</legend>
        <label>مؤذن الفجر
          <select id="fajr-muezzin-select"><option value="same">نفس المؤذن المختار</option></select>
        </label>
        <label>مستوى الصوت <input id="volume" type="range" min="0" max="1" step="0.05"></label>
        <div id="enabled-list" class="checks"></div>
        <label class="check"><input type="checkbox" id="notify"> إشعارات على الجهاز عند دخول الوقت</label>
      </fieldset>

      <fieldset>
        <legend>تعديل يدوي بالدقائق</legend>
        <div id="adjust-list" class="grid3"></div>
      </fieldset>

      <fieldset>
        <legend>أصوات المؤذنين</legend>
        <p class="muted small">ارفع ملف الأذان (MP3) لأي مؤذن، أو ضع رابطاً مباشراً لملف صوتي. الملفات تُحفظ على جهازك فقط.</p>
        <ul id="audio-manager" class="audio-manager"></ul>
      </fieldset>
    </form>
  </dialog>

  <!-- شاشة الأذان -->
  <div id="azan-overlay" class="overlay" hidden>
    <div class="overlay-box">
      <p class="muted">حان الآن موعد أذان</p>
      <h2 id="azan-prayer"></h2>
      <p id="azan-muezzin" class="muted"></p>
      <button id="azan-stop" class="primary">إيقاف الأذان</button>
    </div>
  </div>

  <script src="js/praytimes.js"></script>
  <script src="js/muezzins.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
