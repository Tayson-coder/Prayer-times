name: Android APK

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Bundle azan voices into the app
        run: |
          mkdir -p app/src/main/res/raw
          python3 scripts/voice_urls.py app/src/main/java/app/prayertimes/azan/Data.kt > voices.tsv
          while IFS=$'\t' read -r id url; do
            curl -fsSL --retry 3 -o "app/src/main/res/raw/$id.mp3" "$url" || { echo "BROKEN: $id $url"; exit 1; }
            echo "OK $id ($(stat -c %s "app/src/main/res/raw/$id.mp3") bytes)"
          done < voices.tsv
          count=$(ls app/src/main/res/raw/*.mp3 | wc -l)
          echo "Bundled $count voices"
          test "$count" -eq "$(wc -l < voices.tsv)"
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk prayer-times.apk
      - uses: actions/upload-artifact@v4
        with:
          name: prayer-times-apk
          path: android/prayer-times.apk
          if-no-files-found: error
      - name: Publish release (direct download link)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest prayer-times.apk \
            --target "$GITHUB_SHA" \
            --title "مواقيت الصلاة - أحدث نسخة" \
            --notes "نزّل prayer-times.apk وثبّته على الموبايل. (بُني من ${GITHUB_SHA::7})"
      - name: Save APK copy in the repository
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p ../apk
          cp prayer-times.apk ../apk/prayer-times.apk
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/prayer-times.apk
          git diff --cached --quiet || git commit -m "Update built APK [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
