name: Android APK

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Bundle azan voices into the app
        run: bash scripts/bundle_voices.sh
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk prayer-times.apk
      - uses: actions/upload-artifact@v4
        with:
          name: prayer-times-apk
          path: android/prayer-times.apk
          if-no-files-found: error
      - name: Publish release (direct download link)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest prayer-times.apk \
            --target "$GITHUB_SHA" \
            --title "مواقيت الصلاة - أحدث نسخة" \
            --notes "نزّل prayer-times.apk وثبّته على الموبايل. (بُني من ${GITHUB_SHA::7})"
      - name: Save APK copy in the repository
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p ../apk
          cp prayer-times.apk ../apk/prayer-times.apk
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/prayer-times.apk
          git diff --cached --quiet || git commit -m "Update built APK [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  screenshots:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Bundle azan voices into the app
        run: bash scripts/bundle_voices.sh
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: android
          script: bash scripts/screenshots.sh
      - name: Save screenshots in the repository
        if: always()
        run: |
          cd ..
          ls screenshots || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout -B shots FETCH_HEAD
          git add screenshots
          git diff --cached --quiet || git commit -m "Update app screenshots [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
